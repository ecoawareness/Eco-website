<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقرير عائلة الحصني — التعليم والتمويل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 0; }
  @page portrait { size: A4 portrait; margin: 0; }
  :root{
    --ink:#16302a; --muted:#5d716a; --faint:#8aa093; --line:#e4eae6; --paper:#f6f9f7; --card:#ffffff;
    --green:#137a52; --gold:#a9791a; --green-soft:#e7f3ec;
    --kg:#8b5cf6; --primary:#2f6fed; --prep:#0ea371; --secondary:#e08a1e; --university:#e0533f; --grad:#aeb8b1; --pre:#eef2f0;
    --firas:#d6249f; --muhammad:#e8590c; --faisal:#b58900; --ghiyath:#0d9488;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{ background:#cdd5d0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ font-family:'Tajawal','Cairo',sans-serif; color:var(--ink); font-size:12px; line-height:1.45; }
  .display{ font-family:'Cairo','Tajawal',sans-serif; }
  .num{ font-family:'Cairo',sans-serif; font-feature-settings:"tnum"; }
  .muted{color:var(--muted)} .faint{color:var(--faint)}

  .page{ width:297mm; height:210mm; padding:9mm 11mm; background:#fff; overflow:hidden;
    page-break-after:always; position:relative; display:flex; flex-direction:column; }
  .page:last-child{ page-break-after:auto; }
  @media screen{ .page{ margin:10px auto; box-shadow:0 6px 24px rgba(0,0,0,.18); } }

  /* ---- header ---- */
  .hd{ display:flex; align-items:center; gap:12px; padding-bottom:9px; border-bottom:2px solid var(--green);
    margin-bottom:11px; }
  .crest{ width:46px;height:46px;border-radius:12px; background:linear-gradient(145deg,#137a52,#0c5a3c);
    color:#fff; display:grid; place-items:center; font-family:'Cairo'; font-weight:900; font-size:24px; flex:0 0 auto;}
  .hd h1{ font-family:'Cairo'; font-weight:900; font-size:25px; line-height:1.1; color:#0e3c2b;}
  .hd .sub{ color:var(--muted); font-size:12.5px; margin-top:2px;}
  .hd .right{ margin-right:auto; text-align:left; color:var(--faint); font-size:10.5px; line-height:1.5;}
  .hd .right b{ color:var(--green); font-size:12px;}

  .chips{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:11px;}
  .chip{ background:var(--green-soft); border:1px solid #d2e7da; color:#1c5a40; border-radius:999px;
    padding:4px 11px; font-size:11px; font-weight:500;}
  .chip b{ color:#0e3c2b; font-weight:700;}

  /* ---- KPIs ---- */
  .kpis{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:12px;}
  .kpi{ background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:9px 11px;}
  .kpi.gold{ background:#fbf4e4; border-color:#eedcb4;}
  .kpi .l{ font-size:9.5px; color:var(--faint); font-weight:600;}
  .kpi .v{ font-family:'Cairo'; font-weight:800; font-size:19px; line-height:1.05; margin-top:3px; color:#0e3c2b;}
  .kpi.gold .v{ color:#8a6310;}
  .kpi .n{ font-size:9px; color:var(--muted); margin-top:3px;}

  .sec-t{ font-family:'Cairo'; font-weight:700; font-size:15px; color:#0e3c2b; margin-bottom:9px;
    display:flex; align-items:center; gap:8px;}
  .sec-t::before{ content:""; width:5px; height:17px; border-radius:3px; background:var(--green);}
  .sec-t .s{ font-size:11px; color:var(--muted); font-weight:500;}

  /* ---- branches / kids ---- */
  .branches{ display:flex; flex-direction:column; gap:9px; flex:1;}
  .branch{ border:1px solid var(--line); border-radius:12px; padding:8px 10px; background:#fff;}
  .b-head{ display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .b-dot{ width:11px;height:11px;border-radius:3px; flex:0 0 auto;}
  .b-name{ font-family:'Cairo'; font-weight:700; font-size:13px;}
  .b-stat{ margin-right:auto; font-size:10.5px; color:var(--muted);}
  .kid-row{ display:flex; gap:8px; flex-wrap:wrap;}
  .kid{ flex:1 1 0; min-width:120px; display:flex; gap:8px; align-items:center; background:var(--paper);
    border:1px solid var(--line); border-radius:9px; padding:6px 8px;}
  .av{ width:30px;height:30px;border-radius:8px; flex:0 0 auto; color:#fff; display:grid; place-items:center;
    font-family:'Cairo'; font-weight:700; font-size:13px;}
  .kid .nm{ font-weight:700; font-size:12px; line-height:1.15;}
  .kid .mt{ font-size:9.5px; color:var(--muted);}
  .pill{ display:inline-block; color:#fff; border-radius:999px; padding:1px 7px; font-size:9px; font-weight:700; margin-top:2px;}

  /* ---- timeline ---- */
  table.tl{ border-collapse:collapse; width:100%; font-size:9px; table-layout:fixed;}
  table.tl th,table.tl td{ text-align:center; padding:0; border:1px solid #eef2f0;}
  table.tl thead th{ font-family:'Cairo'; font-weight:600; color:var(--muted); font-size:8.5px; height:18px;}
  table.tl thead th.nowh{ color:#fff; background:var(--gold);}
  table.tl tbody th{ text-align:right; font-weight:700; font-size:10px; width:96px; padding:0 6px; white-space:nowrap;}
  table.tl td .c{ height:17px; display:flex; align-items:center; justify-content:center; color:#fff;
    font-weight:700; font-size:8.5px; font-family:'Cairo';}
  table.tl td.now{ outline:2px solid var(--gold); outline-offset:-2px;}
  .b-dot.sm{ width:8px;height:8px; display:inline-block; margin-left:5px;}
  .legend{ display:flex; gap:13px; flex-wrap:wrap; font-size:10px; color:var(--muted); margin-bottom:8px;}
  .legend span{ display:inline-flex; align-items:center; gap:6px;}
  .legend i{ width:12px;height:12px;border-radius:3px;}

  .charts{ display:grid; grid-template-columns:1.35fr 1fr; gap:12px; margin-top:11px; flex:1;}
  .chart{ border:1px solid var(--line); border-radius:12px; padding:9px 11px; background:#fff; display:flex; flex-direction:column;}
  .chart h3{ font-family:'Cairo'; font-weight:700; font-size:12.5px; margin-bottom:2px;}
  .chart .cap{ font-size:9.5px; color:var(--muted); margin-bottom:6px;}
  .chart svg{ width:100%; height:auto; flex:1;}

  /* ---- page 3 ---- */
  .p3grid{ display:grid; grid-template-columns:37% 1fr; gap:14px; flex:1; min-height:0;}
  .col-side{ display:flex; flex-direction:column; min-height:0;}
  .ins .ic{ padding:7px 10px;} .ins h4{ font-size:11.5px;} .ins p{ font-size:9.5px;}
  table.fin{ width:100%; border-collapse:collapse; font-size:9.7px;}
  table.fin th,table.fin td{ padding:2.5px 6px; text-align:center; border-bottom:1px solid var(--line);}
  table.fin th{ background:var(--green-soft); color:#1c5a40; font-weight:700; font-size:10px;}
  table.fin td:first-child,table.fin th:first-child{ text-align:right;}
  table.fin tr.peak td{ background:#fdecea;} table.fin tr.now td{ background:#fbf4e4;}
  .ins{ display:flex; flex-direction:column; gap:8px;}
  .ic{ border:1px solid var(--line); border-right:4px solid var(--green); border-radius:9px; padding:8px 11px; background:#fff;}
  .ic.red{ border-right-color:var(--university);} .ic.amber{ border-right-color:var(--secondary);} .ic.green{border-right-color:var(--prep);}
  .ic .t{ font-size:9.5px; color:var(--gold); font-weight:700;}
  .ic h4{ font-family:'Cairo'; font-size:12.5px; margin:2px 0 3px; color:#0e3c2b;}
  .ic p{ font-size:10px; color:var(--muted); line-height:1.4;}
  .play{ grid-column:1 / -1; }
  .play-grid{ columns:3; column-gap:13px;}
  .adv{ break-inside:avoid; border:1px solid var(--line); border-radius:9px; padding:7px 10px; margin-bottom:8px; background:var(--paper);}
  .adv h4{ font-family:'Cairo'; font-size:11.5px; margin-bottom:2px; display:flex; gap:6px;}
  .adv p{ font-size:9.5px; color:var(--muted); line-height:1.4;}

  .assume{ background:#fbf7ec; border:1px solid #eedcb4; border-radius:9px; padding:6px 11px; margin-bottom:11px;
    font-size:10px; color:#6b5314; line-height:1.5;} .assume b{ color:#8a6310;}

  /* ---- page 4 ---- */
  .p4{ display:flex; flex-direction:column; gap:11px; flex:1; min-height:0;}
  .p4row{ display:grid; gap:13px;}
  .callout{ background:#fdecea; border:1px solid #f3c4be; border-right:5px solid var(--university); border-radius:11px; padding:10px 13px;}
  .callout .t{ font-size:10px; color:#a23a2c; font-weight:700;}
  .callout .v{ font-family:'Cairo'; font-weight:900; font-size:21px; color:#b3382a; margin:3px 0; line-height:1.1;}
  .callout p{ font-size:10px; color:#7a4a43; line-height:1.45;}
  .scards{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .scard{ border:1px solid var(--line); border-radius:12px; padding:11px 13px;}
  .scard.ideal{ border-top:4px solid var(--green); background:#f2faf6;}
  .scard.likely{ border-top:4px solid var(--gold); background:#fbf7ec;}
  .scard.worst{ border-top:4px solid var(--university); background:#fdf1ef;}
  .scard .nm{ font-family:'Cairo'; font-weight:800; font-size:14.5px;}
  .scard .as{ font-size:9.5px; color:var(--muted); margin:2px 0 8px; min-height:26px;}
  .scard .big{ font-family:'Cairo'; font-weight:900; font-size:23px; line-height:1;}
  .scard.ideal .big{color:#137a52;} .scard.likely .big{color:#8a6310;} .scard.worst .big{color:#b3382a;}
  .scard .biglab{ font-size:9px; color:var(--muted); margin:3px 0 8px;}
  .scard .rw{ display:flex; justify-content:space-between; border-top:1px dashed var(--line); padding-top:4px; margin-top:4px; font-size:10px; color:var(--muted);}
  .scard .rw b{ font-family:'Cairo'; color:var(--ink);}
  .rangeline{ font-size:10px; color:var(--muted); margin-top:7px;} .rangeline b{color:var(--ink); font-family:'Cairo';}
  .src{ border:1px solid var(--line); border-radius:9px; padding:7px 10px; background:var(--paper); margin-bottom:7px; break-inside:avoid;}
  .src h4{ font-family:'Cairo'; font-size:11.5px; color:#0e3c2b; margin-bottom:2px; display:flex; gap:6px; align-items:center;}
  .src p{ font-size:9.5px; color:var(--muted); line-height:1.4;}
  .src .free{ margin-right:auto; background:var(--green-soft); color:#1c5a40; border-radius:999px; padding:1px 7px; font-size:8.5px; font-weight:700;}
  .tipbox{ background:var(--green-soft); border:1px solid #d2e7da; border-radius:9px; padding:8px 11px;}
  .tipbox h4{ font-family:'Cairo'; font-size:11.5px; color:#1c5a40; margin-bottom:4px;}
  .tipbox ul{ margin:0; padding-right:16px;} .tipbox li{ font-size:9.7px; color:#33614a; line-height:1.5; margin-bottom:1px;}
  /* ---- page 6 (portrait) ---- */
  .pageP{ page:portrait; width:210mm; height:297mm; padding:9mm 10mm; background:#fff; overflow:hidden;
    display:flex; flex-direction:column; page-break-before:always; }
  .plegend{ display:flex; flex-wrap:wrap; gap:5px 10px; margin:6px 0 8px; font-size:9.5px;}
  .plegend span{ display:inline-flex; align-items:center; gap:5px; color:var(--muted);}
  .plegend i{ width:11px;height:11px;border-radius:3px;}
  .chart-wrap{ flex:1; min-height:0; display:flex; border:1px solid var(--line); border-radius:10px; padding:6px 8px;}
  .chart-wrap svg{ width:100%; height:100%;}
  .foot{ margin-top:auto; padding-top:7px; border-top:1px solid var(--line); display:flex; justify-content:space-between;
    font-size:9px; color:var(--faint);}
</style>
</head>
<body>
<div id="report"></div>

<script>
/* ===== data (mirrors family-dashboard.html) — عائلة الحصني ===== */
const BRANCHES={
  firas:{ar:"أبناء فراس الحصني",c:"var(--firas)"},
  muhammad:{ar:"أبناء محمد الحصني",c:"var(--muhammad)"},
  faisal:{ar:"ابن فيصل الحصني",c:"var(--faisal)"},
  ghiyath:{ar:"ابن غياث",c:"var(--ghiyath)"},
};
const CHILDREN=[
  {ar:"حنين",b:2007,p:"firas",sch:0,uniFree:true},{ar:"محمد",b:2008,p:"firas",sch:0},{ar:"نور",b:2016,p:"firas",sch:0},
  {ar:"عمر",b:2019,p:"firas",sch:0},{ar:"قمر",b:2025,p:"firas",sch:0},
  {ar:"أحمد",b:2008,p:"muhammad",sch:0},{ar:"رغد",b:2010,p:"muhammad",sch:0},{ar:"رنيم",b:2011,p:"muhammad",sch:0},
  {ar:"تيم",b:2017,p:"muhammad",sch:0},{ar:"شام",b:2021,p:"muhammad",sch:0},
  {ar:"عبد العليم",b:2015,p:"faisal",sch:35000},{ar:"عبد الله",b:2025,p:"ghiyath",sch:0},
];
const GRADES=["KG1","KG2","أول","ثاني","ثالث","رابع","خامس","سادس","سابع","ثامن","تاسع","عاشر","حادي عشر","بكالوريا","جامعة ١","جامعة ٢","جامعة ٣","جامعة ٤","جامعة ٥"];
const STG={pre:{c:"var(--pre)",ar:"قبل المدرسة"},kg:{c:"var(--kg)",ar:"روضة"},primary:{c:"var(--primary)",ar:"ابتدائي (١–٦)"},
  prep:{c:"var(--prep)",ar:"إعدادي (٧–٩)"},secondary:{c:"var(--secondary)",ar:"ثانوي (١٠–١٢)"},
  university:{c:"var(--university)",ar:"جامعة"},grad:{c:"var(--grad)",ar:"متخرّج"}};
const stageKey=i=> i<0?"pre": i<=1?"kg": i<=7?"primary": i<=10?"prep": i<=13?"secondary": i<=13+UNI?"university":"grad";
const YEAR_FROM=2011, YEAR_TO=2047, UNI=4, CUR="ر.ق";
const SCHOOL_STAGES=new Set(["kg","primary","prep","secondary"]);
const UNI_LOW=50000, UNI_MID=60000, UNI_HIGH=70000, INFL=0.04;
const now=new Date(); const NOW=now.getMonth()>=7?now.getFullYear():now.getFullYear()-1;
const idx=(c,y)=>y-c.b-4;
function stageAt(c,y){const i=idx(c,y); return {i,k:stageKey(i)};}
const enrolledK=k=> SCHOOL_STAGES.has(k)||k==="university";
function childCost(c,k,y,uni){ const infl=Math.pow(1+INFL,Math.max(0,y-NOW));
  if(k==="university") return c.uniFree?0:uni*infl;
  if(SCHOOL_STAGES.has(k)) return (c.sch||0)*infl;
  return 0; }
const schoolGrad=c=>c.b+4+13+1, uniGrad=c=>c.b+4+13+UNI+1;
function series(uni){const r=[];for(let y=YEAR_FROM;y<=YEAR_TO;y++){const o={y,st:{kg:0,primary:0,prep:0,secondary:0,university:0},en:0,uni:0,sc:0,tot:0};
  for(const c of CHILDREN){const k=stageAt(c,y).k; if(enrolledK(k)){o.en++; k==="university"?o.uni++:o.sc++; if(y>=NOW){const v=childCost(c,k,y,uni);o.st[k]+=v;o.tot+=v;}}} r.push(o);} return r;}
const fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Math.round(n));
function money(n){const v=Math.round(n); if(v>=1e6)return CUR+" "+(v/1e6).toFixed(v>=1e7?1:2)+"M"; if(v>=1e3)return CUR+" "+fmt(v/1000)+"K"; return CUR+" "+fmt(v);}
const moneyF=n=>CUR+" "+fmt(n);
const cssvar=v=>getComputedStyle(document.documentElement).getPropertyValue(v.replace('var(','').replace(')','')).trim();

const S=series(UNI_MID);
const cur=S.find(r=>r.y===NOW)||{sc:0,uni:0,tot:0,en:0};
const fut=S.filter(r=>r.y>=NOW);
const peak=fut.reduce((a,r)=>r.tot>a.tot?r:a,fut[0]);
const uniPeak=S.reduce((a,r)=>r.uni>a.uni?r:a,S[0]);
const busy=S.reduce((a,r)=>r.en>a.en?r:a,S[0]);
const life=fut.reduce((a,r)=>a+r.tot,0);
const lifeLow=series(UNI_LOW).filter(r=>r.y>=NOW).reduce((a,r)=>a+r.tot,0);
const lifeHigh=series(UNI_HIGH).filter(r=>r.y>=NOW).reduce((a,r)=>a+r.tot,0);
let pre=0,grad=0; for(const c of CHILDREN){const k=stageAt(c,NOW).k; if(k==="pre")pre++; if(k==="grad")grad++;}
const ages=CHILDREN.map(c=>NOW+1-c.b);
const firstG=Math.min(...CHILDREN.map(schoolGrad)), lastG=Math.max(...CHILDREN.map(uniGrad));
// ---- scenario + scholarship helpers ----
const lifeBest=series(0).filter(r=>r.y>=NOW).reduce((a,r)=>a+r.tot,0);   // all uni on scholarship → schools only
const uniTot=rate=>series(rate).filter(r=>r.y>=NOW).reduce((a,r)=>a+r.st.university,0);
const uniLow=uniTot(UNI_LOW), uniMid=uniTot(UNI_MID), uniHigh=uniTot(UNI_HIGH);
const monthsRem=Math.max(1,(lastG-NOW)*12);
const uniSpan=c=>[c.b+18, c.b+18+UNI-1];
function childUniCost(c,rate){let t=0; const[s,e]=uniSpan(c); for(let y=s;y<=e;y++){ if(y<NOW||c.uniFree) continue; t+=rate*Math.pow(1+INFL,Math.max(0,y-NOW)); } return t;}
const uniCount=CHILDREN.filter(c=>!c.uniFree).length;

/* ---- redefined scenarios + revolving family-fund cash-flow model ---- */
const childUniRaw=(c,rate)=>{let t=0;const[s,e]=uniSpan(c);for(let y=Math.max(NOW,s);y<=e;y++)t+=rate*Math.pow(1+INFL,y-NOW);return t;};
const uniAll=rate=>CHILDREN.reduce((a,c)=>a+childUniRaw(c,rate),0);
const schoolTot=lifeBest;                       // remaining school cost (عبد العليم only)
const PARENTS=[{ar:"فيصل",b:1978},{ar:"فراس",b:1980},{ar:"محمد",b:1983},{ar:"غياث",b:1987}];
const parentEnd=p=>p.b+60;
const parentMonths=PARENTS.reduce((a,p)=>a+Math.max(0,parentEnd(p)-NOW)*12,0);
const REPAY_YEARS=10, SIM_END=2058;
function schoolCostYear(y){return CHILDREN.reduce((a,c)=>{const k=stageAt(c,y).k; return a+(SCHOOL_STAGES.has(k)?(c.sch||0)*Math.pow(1+INFL,Math.max(0,y-NOW)):0);},0);}
function simulate(rate,payF,m){            // m = monthly per active parent; returns lowest fund balance
  let fund=0,minB=0;
  for(let y=NOW;y<=SIM_END;y++){
    const active=PARENTS.filter(p=>parentEnd(p)>y).length;
    let cost=schoolCostYear(y), repay=0;
    for(const c of CHILDREN){const[s,e]=uniSpan(c);
      if(y>=Math.max(NOW,s)&&y<=e) cost+=rate*Math.pow(1+INFL,y-NOW)*payF;
      const g=uniGrad(c); if(y>=g+3&&y<=g+2+REPAY_YEARS) repay+=(childUniRaw(c,rate)*payF)/REPAY_YEARS;
    }
    fund+=m*12*active+repay-cost; if(fund<minB)minB=fund;
  }
  return minB;
}
const solveMonthly=(rate,payF)=>{let lo=0,hi=60000;for(let i=0;i<44;i++){const mid=(lo+hi)/2; simulate(rate,payF,mid)>=-1?hi=mid:lo=mid;}return hi;};
const SCEN={
  best: {freeP:"٦٠٪", payF:0.40, rate:50000, T:schoolTot+uniAll(50000)*0.40, uni:uniAll(50000)*0.40, payN:"٥ من ١٢"},
  like: {freeP:"٤٠٪", payF:0.60, rate:50000, T:schoolTot+uniAll(50000)*0.60, uni:uniAll(50000)*0.60, payN:"٧ من ١٢"},
  worst:{freeP:"حنين فقط", payF:11/12, rate:60000, T:schoolTot+uniAll(60000)*(11/12), uni:uniAll(60000)*(11/12), payN:"١١ من ١٢"},
};
SCEN.best.m=solveMonthly(SCEN.best.rate,SCEN.best.payF);
SCEN.like.m=solveMonthly(SCEN.like.rate,SCEN.like.payF);
SCEN.worst.m=solveMonthly(SCEN.worst.rate,SCEN.worst.payF);

/* ===== PAGE 1 ===== */
function header(extra){
  return `<div class="hd">
    <div class="crest">ح</div>
    <div><h1 class="display">لوحة عائلة الحصني</h1>
      <div class="sub">تخطيط التعليم والتمويل · رؤى وتوقّعات وسيناريوهات — مبنية على بياناتكم</div></div>
    <div class="right">${extra||`العام الدراسي<br><b>${NOW}/${NOW+1}</b>`}</div>
  </div>`;
}
function kpi(l,v,n,gold){return `<div class="kpi ${gold?'gold':''}"><div class="l">${l}</div><div class="v num">${v}</div><div class="n">${n}</div></div>`;}
function page1(){
  const chips=[`العام الدراسي <b>${NOW}/${NOW+1}</b>`,`<b>${CHILDREN.length}</b> أبناء`,`<b>4</b> فروع للعائلة`,
    `الأعمار <b>${Math.min(...ages)}–${Math.max(...ages)}</b>`,`أول ← آخر تخرّج <b>${firstG} – ${lastG}</b>`]
    .map(c=>`<span class="chip">${c}</span>`).join("");
  const kpis=[
    kpi("الأبناء",CHILDREN.length,`${pre} قبل المدرسة · ${grad} متخرّج`),
    kpi("في المدرسة الآن",cur.sc,"الروضة ← الصف ١٢"),

function costSVG(){
  const d=S.filter(r=>r.y>=NOW); const W=560,H=230,pl=58,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(1,...d.map(r=>r.tot)); const bw=iw/d.length; const order=["kg","primary","prep","secondary","university"];
  const col={kg:cssvar('--kg'),primary:cssvar('--primary'),prep:cssvar('--prep'),secondary:cssvar('--secondary'),university:cssvar('--university')};
  let g="";
  for(let i=0;i<=4;i++){const yy=pt+ih-ih*i/4; g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#eef2f0"/><text x="${pl-5}" y="${yy+3}" fill="#8aa093" font-size="9" text-anchor="end">${money(max*i/4)}</text>`;}
  d.forEach((r,i)=>{let acc=pt+ih; const x=pl+i*bw+bw*0.16,w=bw*0.68;
    order.forEach(s=>{const h=ih*(r.st[s]/max); if(h>0.4){acc-=h; g+=`<rect x="${x}" y="${acc}" width="${w}" height="${h}" fill="${col[s]}"/>`;}});
    if(r===peak)g+=`<text x="${pl+i*bw+bw/2}" y="${acc-3}" fill="${cssvar('--gold')}" font-size="9" font-weight="700" text-anchor="middle">ذروة</text>`;
    if(r.y%3===0||i===0||i===d.length-1)g+=`<text x="${pl+i*bw+bw/2}" y="${H-pb+13}" fill="#8aa093" font-size="8" text-anchor="middle">${String(r.y).slice(2)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function loadSVG(){
  const W=420,H=230,pl=24,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb; const maxN=Math.max(1,...S.map(r=>r.en));
  const X=y=>pl+iw*((y-YEAR_FROM)/(YEAR_TO-YEAR_FROM)), Y=n=>pt+ih-ih*(n/maxN);
  let g="";
  for(let i=0;i<=maxN;i+=(maxN>8?2:1)){const yy=Y(i); g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#eef2f0"/><text x="${pl-4}" y="${yy+3}" fill="#8aa093" font-size="8" text-anchor="end">${i}</text>`;}
  let area=S.map((r,i)=>`${i?'L':'M'}${X(r.y).toFixed(1)},${Y(r.en).toFixed(1)}`).join(" ")+` L${X(YEAR_TO)},${pt+ih} L${X(YEAR_FROM)},${pt+ih} Z`;
  g+=`<path d="${area}" fill="rgba(19,122,82,.10)"/>`;
  const line=(k,c)=>`<path d="${S.map((r,i)=>`${i?'L':'M'}${X(r.y).toFixed(1)},${Y(r[k]).toFixed(1)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="2"/>`;
  g+=line("en",cssvar('--green'))+line("uni",cssvar('--university'));
  g+=`<line x1="${X(NOW)}" y1="${pt}" x2="${X(NOW)}" y2="${pt+ih}" stroke="${cssvar('--gold')}" stroke-width="1.3" stroke-dasharray="3 2"/><text x="${X(NOW)}" y="${pt-2}" fill="${cssvar('--gold')}" font-size="8" text-anchor="middle">الآن</text>`;
  [YEAR_FROM,2025,2035,YEAR_TO].forEach(y=>g+=`<text x="${X(y)}" y="${H-pb+13}" fill="#8aa093" font-size="8" text-anchor="middle">${y}</text>`);
  g+=`<g font-size="8.5"><rect x="${pl}" y="${H-11}" width="9" height="3" fill="${cssvar('--green')}"/><text x="${pl+13}" y="${H-8}" fill="#5d716a">إجمالي المسجَّلين</text><rect x="${pl+105}" y="${H-11}" width="9" height="3" fill="${cssvar('--university')}"/><text x="${pl+118}" y="${H-8}" fill="#5d716a">في الجامعة</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

  const avgBorrow=uniAll(50000)*0.60/Math.max(1,Math.round(12*0.60)); // typical borrow (likely)
  const inst=avgBorrow/(REPAY_YEARS*12);

  return `<div class="page">${header(`صندوق تعليم العائلة<br><b>الخطة المالية</b>`)}
    <div class="p4">
      <div class="sec-t display">صندوق تعليم العائلة <span class="s">— صندوق دوّار يحوّل العبء إلى خطة مستدامة</span></div>
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px;">${fundPoints}</div>

      <div class="p4row" style="grid-template-columns:1.3fr 1fr; flex:1; min-height:0; margin-top:4px;">
        <div>
          <div class="sec-t display">مساهمة الوالدين <span class="s">— حتى سنّ الستين، بالتساوي</span></div>
          <table class="fin"><thead><tr><th>الأب</th><th>الميلاد</th><th>حتى سنة (٦٠)</th><th>سنوات المساهمة</th><th>نصيب شهري*</th></tr></thead><tbody>${parentsRows}</tbody></table>

          <div class="sec-t display" style="margin-top:11px">خطة الادّخار الشهري — السيناريوهات الثلاثة</div>
          <table class="fin"><thead><tr><th>السيناريو</th><th>أبناء بمنح</th><th>إجمالي التكلفة</th><th>نصيب الأب/شهر</th><th>إجمالي العائلة/شهر</th></tr></thead><tbody>${scenRows}</tbody></table>
          <div class="rangeline">* النصيب الشهري لكل أب (السيناريو المرجّح). «إجمالي العائلة» بافتراض مساهمة الآباء الأربعة معًا؛ يقلّ تدريجيًا كلما بلغ أحدهم الستين، ويعوّضه تراكم المدّخرات وسداد الأبناء.</div>
        </div>
        <div>
          <div class="sec-t display">خطة السداد الميسّرة للأبناء</div>
          <div class="tipbox"><h4>شروط سهلة وعادلة</h4><ul>
            <li>يبدأ السداد بعد ٣ سنوات من التخرّج والاستقرار في العمل.</li>
            <li>بدون أي فوائد، على ${REPAY_YEARS} سنوات (≈ ${REPAY_YEARS*12} قسطًا).</li>
            <li>مثال: من أخذ نحو ${money(avgBorrow)} يسدّد ≈ <b>${moneyF(inst)}/شهر</b> فقط.</li>
            <li>يجوز تأجيل القسط عند التعطّل عن العمل دون غرامة.</li>
            <li>تعود كل الأقساط للصندوق ليكمل الأصغر سنًّا تعليمهم.</li>
          </ul></div>
          <div class="callout" style="margin-top:11px">
            <div class="t">⚠️ خطّط لأسوأ الاحتمالات</div>
            <div class="v num">${moneyF(SCEN.worst.m)}<span style="font-size:12px"> /شهر للأب</span></div>
            <p>في الأسوأ (بلا منح، ٦٠ ألف/سنة): ابدأ بهذا الرقم؛ وكل منحة جامعية يحصل عليها الأبناء تخفّضه نحو ${moneyF(SCEN.best.m)}/شهر في السيناريو المثالي.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="foot"><span>عائلة الحصني · صندوق التعليم الدوّار وخطة الادّخار</span><span>صفحة ٥ من ٦</span></div>
  </div>`;
}

/* ===== PAGE 6 (portrait) — monthly payment by person over time ===== */
const PCOL={"فيصل":"#b58900","فراس":"#d6249f","محمد":"#e8590c","غياث":"#0d9488"};
const KIDPAL=["#2f6fed","#16a34a","#db2777","#9333ea","#0891b2","#dc2626","#4f46e5","#be185d","#15803d","#c2410c","#7c3aed"];
function buildChartPersons(){
  const ppl=[];
  PARENTS.forEach(p=>ppl.push({name:p.ar+" (أب)",color:PCOL[p.ar],start:NOW,end:parentEnd(p)-1,monthly:SCEN.worst.m,role:"أب"}));
  let ki=0;
  CHILDREN.forEach(c=>{ if(c.uniFree) return; const g=uniGrad(c); const borrow=childUniRaw(c,60000);
    ppl.push({name:c.ar,color:KIDPAL[ki++%KIDPAL.length],start:g+3,end:g+2+REPAY_YEARS,monthly:borrow/(REPAY_YEARS*12),role:"ابن"});});
  return ppl;
}
function paymentChart(){
  const P=buildChartPersons();
  const END=Math.max(...P.map(p=>p.end));
  const years=[]; for(let y=NOW;y<=END;y++)years.push(y);
  const totalAt=y=>P.reduce((a,p)=>a+((y>=p.start&&y<=p.end)?p.monthly:0),0);
  const maxM=Math.max(...years.map(totalAt))*1.04;
  const W=620,H=900,pl=42,pr=14,pt=30,pb=30, pw=W-pl-pr, ph=H-pt-pb;
  const n=END-NOW+1, bandH=ph/n;
  const yOf=y=>pt+(y-NOW)*bandH;
  const xOf=v=>pl+v/maxM*pw;
  let g="";
  const step=maxM>30000?10000:5000;
  for(let v=0;v<=maxM;v+=step){const x=xOf(v);
    g+=`<line x1="${x}" y1="${pt}" x2="${x}" y2="${H-pb}" stroke="#eef2f0"/>`
      +`<text x="${x}" y="${pt-7}" fill="#8aa093" font-size="10" text-anchor="middle">${money(v)}</text>`
      +`<text x="${x}" y="${H-pb+15}" fill="#8aa093" font-size="10" text-anchor="middle">${money(v)}</text>`;}
  years.forEach(y=>{ let cx=pl; const yy=yOf(y);
    P.forEach(p=>{ if(y>=p.start&&y<=p.end){ const w=p.monthly/maxM*pw; if(w>0.3){
      g+=`<rect x="${cx}" y="${yy+0.4}" width="${w}" height="${Math.max(1,bandH-0.8)}" fill="${p.color}"><title>${p.name} · ${y} · ${moneyF(p.monthly)}/شهر</title></rect>`; cx+=w; } } });
    if((y-NOW)%2===0) g+=`<text x="${pl-5}" y="${yy+bandH/2+3}" fill="#5d716a" font-size="8.5" text-anchor="end">${y}</text>`;
  });
  // parents reaching 60 (contribution stops)
  PARENTS.forEach(p=>{const yy=yOf(parentEnd(p)); g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="${PCOL[p.ar]}" stroke-dasharray="3 2" stroke-width="1" opacity=".7"/><text x="${W-pr}" y="${yy-2}" fill="${PCOL[p.ar]}" font-size="8" text-anchor="end">${p.ar} ٦٠</text>`;});
  g+=`<text x="${pl-5}" y="${pt-8}" fill="#137a52" font-size="10" font-weight="700" text-anchor="end">اليوم ↑</text>`;
  g+=`<text x="${pl-5}" y="${H-pb+15}" fill="#b3382a" font-size="10" font-weight="700" text-anchor="end">${END} ↓</text>`;
  g+=`<text x="${pl+pw/2}" y="${H-2}" fill="#5d716a" font-size="11" text-anchor="middle">الدفعة الشهرية الإجمالية (ر.ق) — مجزّأة حسب الشخص</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function page6(){
  const P=buildChartPersons();
  const legend=P.map(p=>`<span><i style="background:${p.color}"></i>${p.name}</span>`).join("");
  return `<div class="pageP">${header(`خريطة الدفعات الشهرية<br><b>حسب الشخص عبر الزمن</b>`)}
    <div class="sec-t display">من يدفع كم — شهريًا عبر الزمن <span class="s">— الزمن من الأعلى (اليوم) إلى الأسفل (آخر سداد)</span></div>
    <div class="assume">أساس تحوّطي = السيناريو الأسوأ (جميع الأبناء يدفعون عدا حنين). الآباء يساهمون حتى الستين؛ كل ابن يبدأ سداد قسطه الشهري بعد ٣ سنوات من تخرّجه على ${REPAY_YEARS} سنوات. المنح الجامعية تُلغي شريط الطالب المعني. كل لون = شخص.</div>
    <div class="plegend">${legend}</div>
    <div class="chart-wrap">${paymentChart()}</div>
    <div class="foot"><span>عائلة الحصني · الجدول الزمني الشهري للدفعات والسداد</span><span>صفحة ٦ من ٦</span></div>
  </div>`;
}

document.getElementById('report').innerHTML = page1()+page2()+page3()+page4()+page5()+page6();
</script>
</body>
