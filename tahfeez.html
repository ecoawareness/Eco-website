<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل مراكز التحفيظ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #F7F4EC;
    --card: #FFFFFF;
    --ink: #1B2A23;
    --muted: #5F6E66;
    --line: #E3DECF;
    --green: #1D6A4F;
    --green-soft: #E4EFE8;
    --gold: #B9924C;
    --gold-soft: #F3EAD6;
    --chip-bg: #EFEBDF;
    --btn-call: #1D6A4F;
    --btn-wa: #1F7A54;
    --shadow: 0 1px 3px rgba(27, 42, 35, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121A16;
      --card: #1A241F;
      --ink: #EAE6DA;
      --muted: #9AA79F;
      --line: #2B372F;
      --green: #5BB08D;
      --green-soft: #22352C;
      --gold: #D3B06A;
      --gold-soft: #34301F;
      --chip-bg: #232E28;
      --btn-call: #23573F;
      --btn-wa: #1F6A48;
      --shadow: 0 1px 3px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #121A16;
    --card: #1A241F;
    --ink: #EAE6DA;
    --muted: #9AA79F;
    --line: #2B372F;
    --green: #5BB08D;
    --green-soft: #22352C;
    --gold: #D3B06A;
    --gold-soft: #34301F;
    --chip-bg: #232E28;
    --btn-call: #23573F;
    --btn-wa: #1F6A48;
    --shadow: 0 1px 3px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html { direction: rtl; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 56px; }

  /* ---------- header ---------- */
  header { padding: 26px 2px 14px; text-align: center; }
  .kicker {
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  h1 {
    font-family: "Amiri", "Traditional Arabic", serif;
    font-weight: 700;
    font-size: 32px;
    margin: 2px 0 6px;
    color: var(--green);
    text-wrap: balance;
  }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 auto; max-width: 34em; }
  .sub b { color: var(--ink); font-weight: 600; }
  .rule {
    width: 64px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, var(--gold), var(--green));
    margin: 14px auto 0;
  }

  /* ---------- controls ---------- */
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--ground);
    padding: 10px 0 8px;
    border-bottom: 1px solid var(--line);
  }
  .search-row { display: flex; gap: 8px; }
  .search-row > * { min-width: 0; }
  .search-box { position: relative; flex: 1; }
  .search-box input { min-width: 0; }
  .search-box svg {
    position: absolute; inset-inline-start: 12px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2;
    pointer-events: none;
  }
  input[type="search"], select {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    padding: 10px 36px 10px 12px;
    font: inherit;
    font-size: 15px;
  }
  input[type="search"]:focus, select:focus, .chip:focus-visible, .act:focus-visible, .reset:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 1px;
  }
  select { flex: 0 0 118px; width: 118px; padding: 10px 8px; }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line);
    background: var(--chip-bg);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
    font: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  :root[data-theme="dark"] .chip[aria-pressed="true"] { color: #0E1712; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #0E1712; }
  }
  .count { color: var(--muted); font-size: 12.5px; padding: 10px 2px 2px; }
  .count b { color: var(--green); font-variant-numeric: tabular-nums; }

  /* ---------- cards ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 16px 12px;
  }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .card-top .cname { min-width: 0; overflow-wrap: anywhere; }
  .cname {
    font-family: "Amiri", "Traditional Arabic", serif;
    font-size: 21px; font-weight: 700;
    color: var(--ink);
    line-height: 1.35;
  }
  .badge {
    flex-shrink: 0;
    font-size: 11px; font-weight: 600;
    border-radius: 6px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .badge.normal { background: var(--green-soft); color: var(--green); }
  .badge.donor  { background: var(--gold-soft);  color: var(--gold); }
  .badge.indep  { background: var(--chip-bg);    color: var(--muted); }
  dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13.5px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  dd .mno { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .act {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 9px;
    padding: 8px 4px;
    font: inherit; font-size: 13px; font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .act svg { width: 15px; height: 15px; flex-shrink: 0; }
  .act.call { background: var(--btn-call); color: #fff; }
  .act.wa   { background: var(--btn-wa);   color: #fff; }
  .act.map  { background: none; border-color: var(--line); color: var(--green); }
  .phones2 { margin-top: 6px; font-size: 12px; color: var(--muted); direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }

  .empty {
    text-align: center; color: var(--muted);
    padding: 44px 10px; font-size: 14px;
  }
  .reset {
    margin-top: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--green);
    border-radius: 9px; padding: 7px 18px; font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  footer {
    margin-top: 28px; text-align: center;
    color: var(--muted); font-size: 12px;
    border-top: 1px solid var(--line); padding-top: 14px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="kicker">﴿ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا ﴾</div>
    <h1>دليل مراكز التحفيظ</h1>
    <p class="sub">أسماء المساجد التي فيها التحفيظ وأرقامها ومناطقها — <b id="totC">‏</b> مركزاً في <b id="totA">‏</b> منطقة. ابحث باسم المنطقة أو المسجد أو المركز، وتواصل مع رئيس المركز مباشرة.</p>
    <div class="rule"></div>
  </header>

  <div class="controls">
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <input type="search" id="q" placeholder="ابحث: منطقة، مسجد، مركز، اسم…" aria-label="بحث">
      </div>
      <select id="area" aria-label="اختر المنطقة">
        <option value="">كل المناطق</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="نوع المركز">
      <button class="chip" data-t="" aria-pressed="true">الكل</button>
      <button class="chip" data-t="مركز عادي" aria-pressed="false">مركز عادي</button>
      <button class="chip" data-t="مركز بنظام المتبرعين" aria-pressed="false">بنظام المتبرعين</button>
      <button class="chip" data-t="مبنى مستقل" aria-pressed="false">مبنى مستقل</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>
    لا توجد نتائج مطابقة لبحثك.<br>
    <button class="reset" id="reset">عرض كل المراكز</button>
  </div>

  <footer>يُفتح رابط الخريطة كبحث في خرائط جوجل باسم المسجد والمنطقة.</footer>
</div>

ارح","t":"مركز بنظام المتبرعين","m":"جامع الولدين","n":"323","a":"أم السنيم","h":"نصر صالح محمد سعيد","p":["70300898"],"w":"70300898"}];

  const $ = (id) => document.getElementById(id);
  const list = $('list'), q = $('q'), areaSel = $('area'), countEl = $('count'), emptyEl = $('empty');
  let typeFilter = '';

  // forgiving Arabic normalization for search
  const norm = (s) => String(s || '')
    .replace(/[ً-ْٰـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ي')
    .toLowerCase();

  DATA.forEach(d => { d._s = norm([d.c, d.m, d.a, d.h, d.n].join(' ')); });

  // header totals + area dropdown
  const areas = [...new Set(DATA.map(d => d.a))].sort((a, b) => a.localeCompare(b, 'ar'));
  $('totC').textContent = DATA.length;
  $('totA').textContent = areas.length;
  for (const a of areas) {
    const o = document.createElement('option');
    o.value = a; o.textContent = a;
    areaSel.appendChild(o);
  }

  const badgeClass = { 'مركز عادي': 'normal', 'مركز بنظام المتبرعين': 'donor', 'مبنى مستقل': 'indep' };
  const badgeLabel = { 'مركز عادي': 'مركز عادي', 'مركز بنظام المتبرعين': 'بنظام المتبرعين', 'مبنى مستقل': 'مبنى مستقل' };
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const callIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c1 .3 2 .5 3 .6a2 2 0 0 1 1.6 2Z"/></svg>';
  const waIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.1 8.1 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.1-.3.2-.5 0a6.7 6.7 0 0 1-2-1.2 7.5 7.5 0 0 1-1.4-1.7c-.1-.2 0-.4.1-.5l.4-.4c.1-.2.2-.3.3-.5v-.4c0-.1-.5-1.3-.7-1.8-.2-.5-.4-.4-.5-.4h-.5c-.1 0-.4.1-.6.3-.2.2-.8.8-.8 2s.9 2.3 1 2.5c.1.2 1.7 2.7 4.2 3.8.6.2 1 .4 1.4.5.6.2 1.1.2 1.5.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.4-.2Z"/></svg>';
  const mapIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';

  function cardHTML(d) {
    const mapQ = encodeURIComponent('مسجد ' + d.m + ' ' + d.a + ' قطر');
    const acts = [];
    if (d.p.length) acts.push(`<a class="act call" href="tel:+974${d.p[0]}">${callIcon}اتصال</a>`);
    if (d.w) acts.push(`<a class="act wa" href="https://wa.me/974${d.w}" target="_blank" rel="noopener">${waIcon}واتساب</a>`);
    acts.push(`<a class="act map" href="https://www.google.com/maps/search/?api=1&query=${mapQ}" target="_blank" rel="noopener">${mapIcon}الخريطة</a>`);
    const extra = d.p.length > 1
      ? `<div class="phones2">${d.p.map(p => '+974 ' + p).join(' · ')}</div>` : '';
    return `<article class="card">
      <div class="card-top">
        <div class="cname">${esc(d.c)}</div>
        <span class="badge ${badgeClass[d.t] || 'indep'}">${esc(badgeLabel[d.t] || d.t)}</span>
      </div>
      <dl>
        <dt>المسجد</dt><dd>${esc(d.m)}${d.n ? ` <span class="mno">(رقم ${esc(d.n)})</span>` : ''}</dd>
        <dt>المنطقة</dt><dd>${esc(d.a)}</dd>
        <dt>رئيس المركز</dt><dd>${esc(d.h)}${d.p.length ? '' : ' <span class="mno">(لا يوجد رقم مسجّل)</span>'}</dd>
      </dl>
      <div class="acts">${acts.join('')}</div>
      ${extra}
    </article>`;
  }

  function render() {
    const term = norm(q.value.trim());
    const area = areaSel.value;
    const out = DATA.filter(d =>
      (!term || d._s.includes(term)) &&
      (!area || d.a === area) &&
      (!typeFilter || d.t === typeFilter)
    );
    list.innerHTML = out.map(cardHTML).join('');
    emptyEl.hidden = out.length > 0;
    countEl.innerHTML = out.length === DATA.length
      ? `كل المراكز — <b>${DATA.length}</b> مركزاً`
      : `<b>${out.length}</b> من أصل ${DATA.length} مركزاً`;
  }

  q.addEventListener('input', render);
  areaSel.addEventListener('change', render);
  $('chips').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    typeFilter = btn.dataset.t;
    for (const c of document.querySelectorAll('.chip'))
      c.setAttribute('aria-pressed', String(c === btn));
    render();
  });
  $('reset').addEventListener('click', () => {
    q.value = ''; areaSel.value = ''; typeFilter = '';
    const chips = document.querySelectorAll('.chip');
    for (const c of chips) c.setAttribute('aria-pressed', String(c.dataset.t === ''));
    render();
  });

  render();
</script>
